name: India Deal Scan

# Amazon INDIA scan (Playwright) -> guides/hot.json (essentials + top offers + trending) and guides/offers.json (17 categories).
# Public repo = free Actions minutes. No token/secret needed: the job pushes with the built-in GITHUB_TOKEN.
#
# Optional (Settings -> Secrets and variables -> Actions -> Variables):  AMAZON_IN_TAG = your Amazon India associate id, e.g. yourid-21
# First time: Actions -> India Deal Scan -> Run workflow -> mode = selftest (prints cards per department, writes nothing).
#
# Each run only does what is DUE (hot.json older than 11 h, categories not swept for 11 h), so a run with nothing due ends in seconds.
# India morning window starts 06:00 IST (00:30 UTC); a second identical window runs 12 h later.

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '15 1 * * *'
    - cron: '0 2 * * *'
    - cron: '45 2 * * *'
    - cron: '30 12 * * *'
    - cron: '15 13 * * *'
    - cron: '0 14 * * *'
    - cron: '45 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto | feed | offers | selftest'
        default: 'auto'
      only:
        description: 'offers mode: only this category key (e.g. mobiles) - leave empty for all'
        default: ''

permissions:
  contents: write

concurrency:
  group: india-deal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Playwright + Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Logic tests
        run: python -m unittest discover -s tests -v

      - name: Scan Amazon India
        env:
          AMAZON_IN_TAG: ${{ vars.AMAZON_IN_TAG }}
          SCAN_MODE: ${{ github.event.inputs.mode || 'auto' }}
          SCAN_ONLY: ${{ github.event.inputs.only || '' }}
          BUDGET_MIN: '40'
        run: python tools/scan_in.py

      - name: Commit feed files
        run: |
          git config user.name "india-scan-bot"
          git config user.email "india-scan-bot@users.noreply.github.com"
          git add -A guides
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "feed: India deals updated by bot"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
