name: India Deal Scan

# Amazon INDIA scan (Playwright) -> guides/hot.json (essentials + top offers + trending) and guides/offers.json (17 categories).
# Public repo = free Actions minutes. No token/secret needed: the job pushes with the built-in GITHUB_TOKEN.
#
# Optional (Settings -> Secrets and variables -> Actions -> Variables):  AMAZON_IN_TAG = your Amazon India associate id, e.g. yourid-21
# First time: Actions -> India Deal Scan -> Run workflow -> mode = selftest (prints cards per department, writes nothing).
#
# Each run only does what is DUE (hot.json / a category older than 20 h), so a retry after a good run ends in seconds.
# One night window, 02:07-~05:00 IST, so everything is fresh before 06:00 IST.

on:
  schedule:
    # Once a day, at night India time (IST = UTC+5:30): 02:07, 02:52, 03:37, 04:22 IST.
    # First run does the work; later ones only retry if something failed (nothing is "due" after a good run).
    - cron: '37 20 * * *'
    - cron: '22 21 * * *'
    - cron: '7 22 * * *'
    - cron: '52 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto | feed | offers | selftest'
        default: 'auto'
      only:
        description: 'offers mode: only this category key (e.g. mobiles) - leave empty for all'
        default: ''

permissions:
  contents: write

concurrency:
  group: india-deal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      # Only the feed-scan logic tests gate the scan. Reel tests (test_render_reel.py) need Pillow, which this job does not
      # install -- they once broke every nightly run (render_reel imports PIL) and froze hot.json/offers.json for days.
      - name: Logic tests
        run: python -m unittest discover -s tests -p "test_logic.py" -v

      - name: Scan Amazon India
        env:
          AMAZON_IN_TAG: ${{ vars.AMAZON_IN_TAG }}
          SCAN_MODE: ${{ github.event.inputs.mode || 'auto' }}
          SCAN_ONLY: ${{ github.event.inputs.only || '' }}
          BUDGET_MIN: '40'
          FEED_EVERY_H: '20'
          SWEEP_EVERY_H: '20'
          FRESH_H: '48'
        run: python tools/scan_in.py

      - name: Commit feed files
        run: |
          git config user.name "india-scan-bot"
          git config user.email "india-scan-bot@users.noreply.github.com"
          git add -A guides
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "feed: India deals updated by bot"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 6
          done
          echo "push failed after retries"; exit 1
